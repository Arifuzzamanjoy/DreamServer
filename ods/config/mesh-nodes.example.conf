# DreamReason mesh roster — every node in the mesh, including this one.
#
# Copy to config/mesh-nodes.conf and put the SAME file on EVERY node. It is the
# single source of truth: scripts/mesh-connect.sh derives tunnel ports from a
# node's position here, so an identical roster gives every node an identical
# view of the mesh. Reorder the lines and the ports move.
#
# Format:  <name> <user>@<host>:<ssh-port>
#
# The name is what shows up as the peer hostname on /api/mesh/peers.
# The SSH port is the one the provider published — on Vast.ai read it from
# VAST_TCP_PORT_22 inside the instance, not from the container's own :22.
#
# Why SSH rather than the service ports directly: Vast.ai only publishes ports
# requested when the instance was CREATED, and 22 is the one that is always
# there. Tunnelling 3002/4000 over it needs nothing from the provider, so a
# mesh can be formed from instances that were never set up for one.

vast-a root@203.0.113.10:41287
vast-b root@198.51.100.22:39104
vast-c root@192.0.2.45:35218
