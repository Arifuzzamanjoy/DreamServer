model_list:
- model_name: local
  litellm_params:
    model: openai/default
    api_base: http://llama-server:8080/v1
    api_key: not-needed
- model_name: default
  litellm_params:
    model: openai/default
    api_base: http://llama-server:8080/v1
    api_key: not-needed
- model_name: mesh
  litellm_params:
    model: openai/mesh
    api_base: http://dreamreason:9200/v1
    api_key: not-needed
  model_info:
    ods_role: coordinator
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 120
  stream_timeout: 60
