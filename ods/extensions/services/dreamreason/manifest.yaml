schema_version: ods.services.v1

compatibility:
  ods_min: "2.0.0"

service:
  id: dreamreason
  name: DreamReason Coordinator
  aliases: [mesh]
  container_name: ods-dreamreason
  host_env: DREAMREASON_HOST
  default_host: dreamreason
  port: 9200
  external_port_env: DREAMREASON_PORT
  external_port_default: 9200
  health: /health
  ui_path: /health
  type: docker
  gpu_backends: [all]
  compose_file: compose.yaml
  category: optional
  depends_on: [litellm]
