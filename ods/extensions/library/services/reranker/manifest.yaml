schema_version: ods.services.v1

service:
  id: reranker
  name: TEI Reranker
  aliases: [rerank]
  container_name: ods-reranker
  host_env: RERANKER_HOST
  default_host: reranker
  port: 80
  external_port_env: RERANKER_PORT
  external_port_default: 8091
  health: /health
  type: docker
  gpu_backends: [all]
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: "Cross-encoder reranker (Text Embeddings Inference) that reorders RAG search results for higher retrieval accuracy."
  env_vars: []

features:
  - id: rag-reranking
    name: RAG Reranking
    description: Cross-encoder reranking to improve RAG retrieval quality
    icon: ListFilter
    category: data
    requirements:
      services: [reranker]
      vram_gb: 0
    enabled_services_all: [reranker]
    setup_time: ~1 minute
    priority: 8
